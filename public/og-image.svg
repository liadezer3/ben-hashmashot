<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="50%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fed7aa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="200" fill="#fef3c7" opacity="0.5"/>
  <circle cx="1100" cy="100" r="150" fill="#fed7aa" opacity="0.5"/>
  
  <!-- Main content area -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="white" opacity="0.9"/>
  
  <!-- Candle icon -->
  <g transform="translate(150, 180)">
    <rect x="35" y="60" width="30" height="100" rx="4" fill="url(#accent)"/>
    <ellipse cx="50" cy="50" rx="25" ry="35" fill="#fbbf24"/>
    <ellipse cx="50" cy="45" rx="15" ry="25" fill="#fef3c7"/>
    <ellipse cx="50" cy="42" rx="8" ry="15" fill="white"/>
  </g>
  
  <!-- App name in Hebrew -->
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#92400e">בין השמשות</text>
  
  <!-- Tagline -->
  <text x="280" y="330" font-family="Arial, sans-serif" font-size="36" fill="#a16207">תזכורת שבת חכמה 🕯️</text>
  
  <!-- Features -->
  <text x="280" y="410" font-family="Arial, sans-serif" font-size="28" fill="#78716c">✓ SMS  ✓ וואטסאפ  ✓ מייל  ✓ פוש</text>
  <text x="280" y="460" font-family="Arial, sans-serif" font-size="24" fill="#a8a29e">חינם · מדויק לפי המיקום שלך</text>
  
  <!-- URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="24" fill="#d97706" text-anchor="middle">ben-hashmashot.com</text>
</svg>
